name: .NET MAUI Build

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/AliceNovel/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'src/AliceNovel/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  PROJECT_PATH: src/AliceNovel/AliceNovel.csproj

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - tfm: net10.0-android
            os: ubuntu-26.04
          - tfm: net10.0-ios
            os: xcode-27
            options: -r ios-arm64 -p:EnableCodeSigning=false
          - tfm: net10.0-maccatalyst
            os: xcode-27
          - tfm: net10.0-windows10.0.19041.0
            os: windows-2025
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # currently, the xcode-27 **does not** contains the xcode 27.2 (latest) as default. See also:
      # https://github.com/actions/runner-images/blob/xcode-27-arm64/20261104.0337/images/macos/xcode-27-arm64-Readme.md#xcode
      - if: matrix.os == 'xcode-27'
        name: Setup Xcode latest
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest' # including beta version

      - name: Install MAUI Workloads
        run: |
          dotnet workload restore ${{ env.PROJECT_PATH }} --ignore-failed-sources

      - name: Restore Dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }} ${{ matrix.options }}

      - name: Publish MAUI App
        run: >
          dotnet publish ${{ env.PROJECT_PATH }}
          -c Release -f ${{ matrix.tfm }} --no-restore
          -p:PublishReadyToRun=false ${{ matrix.options }}

      # Upload Artifact
      - if: matrix.tfm == 'net10.0-android'
        name: Android Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-build
          path: src/AliceNovel/bin/Release/net10.0-android/*Signed.a*

      - if: matrix.tfm == 'net10.0-ios'
        name: iOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ci-build
          path: src/AliceNovel/bin/Release/net10.0-ios/**/*.app/

      - if: matrix.tfm == 'net10.0-maccatalyst'
        name: MacCatalyst Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-ci-build
          path: src/AliceNovel/bin/Release/net10.0-maccatalyst/**/*.app/

      - if: matrix.tfm == 'net10.0-windows10.0.19041.0'
        name: Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-ci-build
          path: src/AliceNovel/bin/Release/net10.0-windows*/**/

      - name: Full Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: full-ci-build-${{ matrix.tfm }}
          path: src/AliceNovel/bin/Release/${{ matrix.tfm }}*/
